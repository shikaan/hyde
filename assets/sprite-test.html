<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sprite test</title>
  <style>
    body { margin: 0; background: #222222; }
    canvas { display: block; margin: 0 auto; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.65); color: #eee; font: 13px monospace;
      padding: 10px 14px; border-radius: 8px; user-select: none;
    }
    #ui label { display: block; margin-top: 8px; }
    #ui input { vertical-align: middle; width: 140px; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <label>speed <span id="speed-val"></span><input id="speed" type="range" min="0" max="600" step="10" value="240"></label>
    <label>anim fps <span id="fps-val"></span><input id="fps" type="range" min="4" max="60" step="1" value="30"></label>
    <label>scale <span id="scale-val"></span><input id="scale" type="range" min="10" max="150" step="5" value="50"></label>
    <label><input id="reverse" type="checkbox" checked style="width:auto;margin-right:6px">reverse anim</label>
  </div>
  <script type="module">
    import kaplay from "./lib/kaplay.mjs"

    let SPEED = 240
    let FPS = 30
    const dirFiles = {
      up: "back", upleft: "back_left", upright: "back_right",
      left: "left", right: "right",
      down: "front", downleft: "front_left", downright: "front_right",
    }

    // Layout and frame data come from the sheet's metadata file.
    const meta = await (await fetch("hyde/hyde_sheet.json")).json()
    const COLS = meta.columns
    const N = meta.frames.length
    // The test page lives next to the hyde/ folder; the JSON points at the image by name.
    const rows = Object.fromEntries(meta.directions.map((d) => [d.name, d.row]))

    kaplay({ background: "#222222", width: meta.cell_width * 2, height: meta.cell_height * 2 })

    // One packed sheet: 8 direction rows x COLS frames per row, sliced row-major.
    loadSprite("hyde", `hyde/${meta.image}`, { sliceX: COLS, sliceY: meta.directions.length })

    const player = add([anchor("bot"), sprite("hyde"), scale(0.5), pos(center())])

    function bind(id, fmt, apply) {
      const input = document.getElementById(id)
      const label = document.getElementById(id + "-val")
      const update = () => {
        const v = input.valueAsNumber
        label.textContent = fmt(v)
        apply(v)
      }
      input.addEventListener("input", update)
      update()
    }
    bind("speed", (v) => v + " px/s", (v) => { SPEED = v })
    const fpsEl = document.getElementById("fps")
    fpsEl.value = meta.fps
    bind("fps", (v) => v + " fps", (v) => { FPS = v })
    bind("scale", (v) => (v / 100).toFixed(2) + "x", (v) => {
      const s = v / 100
      player.scale = vec2(s, s)
    })
    const reverseEl = document.getElementById("reverse")
    let REVERSE = reverseEl.checked
    reverseEl.addEventListener("input", () => { REVERSE = reverseEl.checked })

    let facing = "front"
    let walkT = 0

    function directionFromInput(x, y) {
      return dirFiles[
        (y < 0 ? "up" : y > 0 ? "down" : "") + (x < 0 ? "left" : x > 0 ? "right" : "")
      ]
    }

    onUpdate(() => {
      let x = 0, y = 0
      if (isKeyDown("left")) x -= 1
      if (isKeyDown("right")) x += 1
      if (isKeyDown("up")) y -= 1
      if (isKeyDown("down")) y += 1

      if (x !== 0 || y !== 0) {
        const len = Math.sqrt(x * x + y * y)
        // p.move() multiplies by dt() internally - pass velocity, not a step.
        player.move(x / len * SPEED, y / len * SPEED)
        walkT += dt()

        facing = directionFromInput(x, y)
        const f = Math.floor(walkT * FPS) % N
        const col = REVERSE ? (N - f) % N : f
        player.frame = rows[facing] * COLS + col
      } else {
        walkT = 0
        player.frame = rows[facing] * COLS
      }
    })
  </script>
</body>
</html>
