<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sprite test</title>
  <style>
    body { margin: 0; background: #222222; }
    canvas { display: block; margin: 0 auto; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,.65); color: #eee; font: 13px monospace;
      padding: 10px 14px; border-radius: 8px; user-select: none;
    }
    #ui label { display: block; margin-top: 8px; }
    #ui input { vertical-align: middle; width: 140px; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <label>speed <span id="speed-val"></span><input id="speed" type="range" min="0" max="600" step="10" value="240"></label>
    <label>anim fps <span id="fps-val"></span><input id="fps" type="range" min="4" max="30" step="1" value="14"></label>
    <label>scale <span id="scale-val"></span><input id="scale" type="range" min="10" max="150" step="5" value="50"></label>
    <label><input id="reverse" type="checkbox" checked style="width:auto;margin-right:6px">reverse anim</label>
  </div>
  <script type="module">
    import kaplay from "./lib/kaplay.mjs"

    // Frames 18-21 of every direction are pixel-identical duplicates of frame 1
    // (verified), so the true walk cycle is frames 1-17.
    const W = 410, H = 512, N = 17
    let SPEED = 240
    let FPS = 14
    const dirFiles = {
      up: "back", upleft: "back_left", upright: "back_right",
      left: "left", right: "right",
      down: "front", downleft: "front_left", downright: "front_right",
    }
    const pad = (n) => String(n).padStart(4, "0")

    kaplay({ background: "#222222", width: W * 2, height: H * 2 })

    // Composite each direction's 21 PNGs into one per-direction spritesheet.
    async function loadDirection(d) {
      const imgs = await Promise.all(Array.from({ length: N }, (_, i) =>
        new Promise((res, rej) => {
          const img = new Image()
          img.onload = () => res(img)
          img.onerror = () => rej(new Error(`frames/${d}/${d}_${pad(i + 1)}.png`))
          img.src = `frames/${d}/${d}_${pad(i + 1)}.png`
        })))
      const sheet = document.createElement("canvas")
      sheet.width = W * N
      sheet.height = H
      const ctx = sheet.getContext("2d")
      imgs.forEach((img, i) => ctx.drawImage(img, i * W, 0))
      loadSprite(d, sheet.toDataURL(), { sliceX: N })
    }

    const DIRECTIONS = ["front","back","left","right","front_left","front_right","back_left","back_right"]
    await Promise.all(DIRECTIONS.map(loadDirection))

    // One object per direction, stacked on the same spot; toggling visibility switches facing.
    const players = {}
    for (const d of DIRECTIONS) {
      const p = add([anchor("bot"), sprite(d), scale(0.5), pos(center())])
      p.hidden = d !== "front"
      players[d] = p
    }
    const all = Object.values(players)

    function bind(id, fmt, apply) {
      const input = document.getElementById(id)
      const label = document.getElementById(id + "-val")
      const update = () => {
        const v = input.valueAsNumber
        label.textContent = fmt(v)
        apply(v)
      }
      input.addEventListener("input", update)
      update()
    }
    bind("speed", (v) => v + " px/s", (v) => { SPEED = v })
    bind("fps", (v) => v + " fps", (v) => { FPS = v })
    bind("scale", (v) => (v / 100).toFixed(2) + "x", (v) => {
      const s = v / 100
      all.forEach((p) => (p.scale = vec2(s, s)))
    })
    const reverseEl = document.getElementById("reverse")
    let REVERSE = reverseEl.checked
    reverseEl.addEventListener("input", () => { REVERSE = reverseEl.checked })

    let facing = "front"
    let walkT = 0

    function directionFromInput(x, y) {
      return dirFiles[
        (y < 0 ? "up" : y > 0 ? "down" : "") + (x < 0 ? "left" : x > 0 ? "right" : "")
      ]
    }

    onUpdate(() => {
      let x = 0, y = 0
      if (isKeyDown("left")) x -= 1
      if (isKeyDown("right")) x += 1
      if (isKeyDown("up")) y -= 1
      if (isKeyDown("down")) y += 1

      if (x !== 0 || y !== 0) {
        const len = Math.sqrt(x * x + y * y)
        // p.move() multiplies by dt() internally - pass velocity, not a step.
        all.forEach((p) => p.move(x / len * SPEED, y / len * SPEED))
        walkT += dt()

        const dir = directionFromInput(x, y)
        if (dir !== facing) {
          players[facing].hidden = true
          players[dir].hidden = false
          facing = dir
        }
        const f = Math.floor(walkT * FPS) % N
        players[facing].frame = REVERSE ? (N - f) % N : f
      } else {
        walkT = 0
        players[facing].frame = 0
      }
    })
  </script>
</body>
</html>
